[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "face-mask-detector-nadm2059"  # <--- Update to a unique name
version = "1.0.0"
description = "Dual-framework (TensorFlow & PyTorch) face mask detection system with Streamlit deployment."
readme = "README.md"
authors = [{ name = "Nadhirah" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "tensorflow",
    "torch",
    "torchvision",
    "opencv-python",
    "numpy",
    "streamlit",
    "pillow"
]

[project.urls]
Homepage = "https://github.com/nadm2059/FaceMaskDetection_OPENCV_withAIandML"
